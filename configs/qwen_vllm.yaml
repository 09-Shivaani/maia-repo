# Qwen VL served by vLLM (faster than Ollama for long agent runs):
#   vllm serve Qwen/Qwen2.5-VL-7B-Instruct --port 8000 --max-model-len 32768 --limit-mm-per-prompt image=32
backbones:
  vision_agent:
    provider: vllm
    model: Qwen/Qwen2.5-VL-7B-Instruct
    supports_vision: true
    temperature: 0.0
    max_tokens: 4096
    enable_thinking: false
    max_images_per_message: 30
  describer:
    provider: vllm
    model: Qwen/Qwen2.5-VL-7B-Instruct
    supports_vision: true
    temperature: 0.0
    max_tokens: 512
    enable_thinking: false
