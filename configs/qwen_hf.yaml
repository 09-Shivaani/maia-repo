# Qwen VL loaded in-process with transformers (no server). Needs enough GPU memory for Qwen + diffusion models.
backbones:
  vision_agent:
    provider: hf
    model: Qwen/Qwen2.5-VL-7B-Instruct
    supports_vision: true
    temperature: 0.0
    max_tokens: 4096
    torch_dtype: bfloat16
  describer: vision_agent
